name: 缺陷报告
description: 报告可以稳定复现的错误
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先移除密码、个人数据、私有流量和比赛受限资料。安全漏洞请按 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: 版本
      description: Release 版本或提交哈希
      placeholder: v0.1.0 / abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 23H2, Python 3.11, Node.js 20
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: 发生阶段
      options:
        - 实时预览
        - 正式运行
        - 导出
        - 项目存储
        - 界面交互
        - 启动或构建
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写清节点顺序、连接和关键配置
      placeholder: |
        1. 添加 CSV 输入...
        2. 连接过滤节点...
        3. 点击运行全部...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与日志
      description: 请粘贴已脱敏的错误信息
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，未找到相同问题
          required: true
        - label: 我确认附件不包含密码、个人信息或未授权数据
          required: true
